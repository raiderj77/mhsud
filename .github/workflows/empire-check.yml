name: Empire Compliance Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1 — Build (runs in parallel with compliance)
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

  # ────────────────────────────────────────────────────────────────
  # Job 2 — Empire compliance gates (no Node required)
  # ────────────────────────────────────────────────────────────────
  compliance:
    name: Compliance Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Check 2: Required public files ──────────────────────────
      - name: Required public files exist
        run: |
          # Files may live in public/ (Next.js layout) OR at repo root (flat static sites).
          # We accept either location.
          FAILED=0
          for STEM in robots llms; do
            if [ -f "public/${STEM}.txt" ]; then
              echo "✓ public/${STEM}.txt"
            elif [ -f "${STEM}.txt" ]; then
              echo "✓ ${STEM}.txt (root)"
            else
              echo "::error::MISSING — ${STEM}.txt required at public/${STEM}.txt or ./${STEM}.txt. Empire Standard requires this on every site."
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      # ── Check 3: MindCheckTools permanent no-display-ad rule ────
      - name: Display-ad artifacts remain absent
        run: |
          for FILE in public/ads.txt ads.txt src/components/AdSlot.tsx; do
            if [ -f "$FILE" ]; then
              echo "::error file=$FILE::MindCheckTools does not permit display advertising. Remove this artifact."
              exit 1
            fi
          done
          echo "✓ No display-ad seller declaration or component"

      # ── Check 4: AI crawler rules in robots.txt ─────────────────
      - name: AI crawler rules in robots.txt
        run: |
          ROBOTS_FILE=""
          if [ -f public/robots.txt ]; then ROBOTS_FILE="public/robots.txt"
          elif [ -f robots.txt ]; then ROBOTS_FILE="robots.txt"
          fi
          if [ -z "$ROBOTS_FILE" ]; then
            echo "::warning::Skipping robots.txt check — file missing (caught above)"
            exit 0
          fi
          FAILED=0
          for BOT in GPTBot ClaudeBot PerplexityBot Google-Extended; do
            if ! grep -q "^User-agent: ${BOT}" "$ROBOTS_FILE"; then
              echo "::error file=$ROBOTS_FILE::ROBOTS FAIL — Missing 'User-agent: ${BOT}'."
              FAILED=1
            else
              echo "✓ User-agent: ${BOT}"
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      # ── Check 5: IndexNow key file ───────────────────────────────
      - name: IndexNow key file exists
        run: |
          KEY_FILE=""
          # Search public/ first, then repo root.
          for SEARCH in public . ; do
            while IFS= read -r F; do
              STEM=$(basename "$F" .txt)
              if [[ "$STEM" =~ ^[0-9a-f]{32}$ ]]; then
                KEY_FILE="$F"
                break 2
              fi
            done < <(find "$SEARCH" -maxdepth 1 -name "*.txt" 2>/dev/null || true)
          done
          if [ -z "$KEY_FILE" ]; then
            echo "::error::INDEXNOW FAIL — No IndexNow key file found. Expected a 32-hex-char .txt file at public/ or repo root."
            exit 1
          fi
          echo "✓ IndexNow key file: $KEY_FILE"

      # ── Check 6: Author byline policy (updated 2026-05-11) ─────
      # Policy: MindCheck Tools is the publisher. Jason Ramirez is the named
      # clinical reviewer for MindCheck Tools, within CADC-II scope. Keep the
      # public reviewer name and credential, but never publish LLC, residential
      # location/address, or unrelated personal-history details.
      - name: Publisher and reviewer attribution present (informational)
        env:
          REPO: ${{ github.repository }}
        run: |
          SEARCH_DIRS=()
          for DIR in src app components lib hooks types config public content; do
            [ -d "$DIR" ] && SEARCH_DIRS+=("$DIR")
          done

          if [ "${#SEARCH_DIRS[@]}" -eq 0 ]; then
            echo "ℹ No standard source directories — skipping byline check"
            exit 0
          fi

          PUBLISHER_MATCHES=$(grep -rl "MindCheck Tools" "${SEARCH_DIRS[@]}" 2>/dev/null | wc -l || echo 0)
          REVIEWER_MATCHES=$(grep -rl "Jason Ramirez" "${SEARCH_DIRS[@]}" 2>/dev/null | wc -l || echo 0)
          CREDENTIAL_MATCHES=$(grep -rl "Certified Alcohol and Drug Counselor Level II (CADC-II)" "${SEARCH_DIRS[@]}" 2>/dev/null | wc -l || echo 0)

          if [ "$PUBLISHER_MATCHES" -eq 0 ]; then
            echo "::warning::No 'MindCheck Tools' publisher attribution found."
          fi
          if [ "$REVIEWER_MATCHES" -eq 0 ] || [ "$CREDENTIAL_MATCHES" -eq 0 ]; then
            echo "::warning::Named reviewer attribution is incomplete. Keep Jason Ramirez and the exact CADC-II credential public on the reviewer profile and reviewed content."
          else
            echo "✓ MindCheck Tools publisher and named CADC-II reviewer attribution present"
          fi

          if grep -rEql "Your Friendly Developer|Prunedale|Salinas|PostalAddress|recovering addict|storage shed" "${SEARCH_DIRS[@]}" 2>/dev/null; then
            echo "::warning::Public source may contain private LLC, address/location, or unrelated personal-history details."
          fi
