name: MindCheckTools Compliance Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

  compliance:
    name: Compliance Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Required public files exist
        run: |
          FAILED=0
          for STEM in robots llms; do
            if [ -f "public/${STEM}.txt" ]; then
              echo "✓ public/${STEM}.txt"
            elif [ -f "${STEM}.txt" ]; then
              echo "✓ ${STEM}.txt (root)"
            else
              echo "::error::MISSING — ${STEM}.txt is required."
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Display ads and GA stay removed
        run: |
          for FILE in public/ads.txt ads.txt src/components/AdSlot.tsx; do
            if [ -f "$FILE" ]; then
              echo "::error file=$FILE::MindCheckTools does not permit display advertising. Remove this artifact."
              exit 1
            fi
          done

          if grep -rEIn \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
            'ca-pub-[0-9]+|G-[A-Z0-9]{8,}|googlesyndication|adsbygoogle|google-adsense-account|googletagmanager\.com/gtag|NEXT_PUBLIC_ADSENSE_|NEXT_PUBLIC_GOOGLE_CERTIFIED_CMP_READY' \
            src next.config.mjs .env.example 2>/dev/null; then
            echo "::error::Google analytics or display-ad runtime identifiers were found in production source."
            exit 1
          fi
          echo "✓ No display-ad or GA runtime identifiers"

      - name: AI crawler rules in robots.txt
        run: |
          ROBOTS_FILE="public/robots.txt"
          [ -f "$ROBOTS_FILE" ] || ROBOTS_FILE="robots.txt"
          FAILED=0
          for BOT in OAI-SearchBot ChatGPT-User Claude-SearchBot PerplexityBot; do
            if ! grep -q "^User-agent: ${BOT}" "$ROBOTS_FILE"; then
              echo "::error file=$ROBOTS_FILE::Missing User-agent: ${BOT}"
              FAILED=1
            else
              echo "✓ User-agent: ${BOT}"
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: IndexNow key file exists
        run: |
          KEY_FILE=""
          for SEARCH in public . ; do
            while IFS= read -r F; do
              STEM=$(basename "$F" .txt)
              if [[ "$STEM" =~ ^[0-9a-f]{32}$ ]]; then
                KEY_FILE="$F"
                break 2
              fi
            done < <(find "$SEARCH" -maxdepth 1 -name "*.txt" 2>/dev/null || true)
          done
          if [ -z "$KEY_FILE" ]; then
            echo "::error::No IndexNow key file found."
            exit 1
          fi
          echo "✓ IndexNow key file: $KEY_FILE"

      - name: Publisher and reviewer attribution present
        run: |
          SEARCH_DIRS=()
          for DIR in src app components lib hooks types config public; do
            [ -d "$DIR" ] && SEARCH_DIRS+=("$DIR")
          done

          PUBLISHER_MATCHES=$(grep -rl "MindCheck Tools" "${SEARCH_DIRS[@]}" 2>/dev/null | wc -l || echo 0)
          REVIEWER_MATCHES=$(grep -rl "Jason Ramirez" "${SEARCH_DIRS[@]}" 2>/dev/null | wc -l || echo 0)
          CREDENTIAL_MATCHES=$(grep -rl "Certified Alcohol and Drug Counselor Level II (CADC-II)" "${SEARCH_DIRS[@]}" 2>/dev/null | wc -l || echo 0)

          [ "$PUBLISHER_MATCHES" -gt 0 ] || echo "::warning::No MindCheck Tools publisher attribution found."
          if [ "$REVIEWER_MATCHES" -eq 0 ] || [ "$CREDENTIAL_MATCHES" -eq 0 ]; then
            echo "::warning::Named CADC-II reviewer attribution is incomplete."
          else
            echo "✓ Publisher and scoped CADC-II reviewer attribution present"
          fi

          if grep -rEql "Your Friendly Developer|Prunedale|Salinas|PostalAddress|recovering addict|storage shed" "${SEARCH_DIRS[@]}" 2>/dev/null; then
            echo "::warning::Public source may contain private LLC, address/location, or unrelated personal-history details."
          fi
